apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy-service
  namespace: cinemaabyss
  labels:
    app: proxy-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proxy
  template:
    metadata:
      labels:
        app: proxy
    spec:
      containers:
      - name: proxy-service
        image: ghcr.io/alamonall/ya-abyss/proxy-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: cinemaabyss-config
        env:
        - name: PORT
          value: "8000"
        # readinessProbe:
        #   httpGet:
        #     path: /api/proxy/health
        #     port: 8000
        #   initialDelaySeconds: 5
        #   periodSeconds: 10
        # livenessProbe:
        #   httpGet:
        #     path: /api/proxy/health
        #     port: 8000
        #   initialDelaySeconds: 15
        #   periodSeconds: 20
      restartPolicy: Always
      imagePullSecrets:
        - name: dockerconfigjson
---
apiVersion: v1
kind: Service
metadata:
  name: proxy-service
  namespace: cinemaabyss
spec:
  selector:
    app: proxy
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
